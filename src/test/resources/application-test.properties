spring.application.name=RestApiForMusic
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Use H2 in-memory database for tests instead of MySQL
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Storage path (use temp directory for tests)
app.storage.path=${java.io.tmpdir}/music-test

# Session configuration for tests
spring.session.jdbc.initialize-schema=always
